    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Nothing else sets a background before React mounts and paints App.jsx's own
         theme.bgDeep div — without this, the browser's unstyled default shows through
         on every reload: white in light mode, near-black in many dark-mode browsers.
         That's the "noir ou blanc au reload" flash, not a PixiJS/canvas issue. -->
    <style>html, body { background: #e9d8ae; }</style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
